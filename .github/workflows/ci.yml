name: Seven-Branch RAG Regression Matrix
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: ["main", "step-01-create-corpus-and-benchmark-fixtures", "step-02-normalize-and-expand-queries", "step-03-retrieve-cited-document-candidates", "step-04-rerank-and-diagnose-ranked-results", "step-05-evaluate-grounded-generated-responses", "step-06-run-end-to-end-rag-regression-suite"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
